name: Build macOS DMG (Intel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel

    defaults:
      run:
        working-directory: openspot-desktop

    env:
      CI: "true"
      NODE_ENV: "production"
      APP_NAME: "OpenSpot"
      EXPO_PUBLIC_API_BASE_URL: "https://www.jiosaavn.com/api.php"
      EXPO_PUBLIC_YT_API_INSTANCES: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openspot-desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          EXPO_PUBLIC_API_BASE_URL=https://www.jiosaavn.com/api.php
          EXPO_PUBLIC_YT_API_INSTANCES=
          EOF

      - name: Create Tauri capabilities
        run: |
          mkdir -p src-tauri/capabilities

          cat > src-tauri/capabilities/default.json <<'EOF'
          {
            "$schema": "../gen/schemas/desktop-schema.json",
            "identifier": "default",
            "description": "Default capability for OpenSpot",
            "windows": [
              "main"
            ],
            "permissions": [
              "core:default",
              "http:default",
              "shell:allow-open"
            ]
          }
          EOF

      - name: Verify configuration
        run: |
          echo "EXPO_PUBLIC_API_BASE_URL=$EXPO_PUBLIC_API_BASE_URL"
          echo "EXPO_PUBLIC_YT_API_INSTANCES=$EXPO_PUBLIC_YT_API_INSTANCES"
          echo ""
          echo "--- .env ---"
          cat .env
          echo ""
          echo "--- capabilities/default.json ---"
          cat src-tauri/capabilities/default.json

      - name: Build Tauri app (Intel)
        run: |
          npm run tauri:build -- --target x86_64-apple-darwin

      - name: Verify Intel binary
        run: |
          find src-tauri/target/x86_64-apple-darwin/release/bundle/macos \
            -type f \
            -path "*/Contents/MacOS/*" \
            -exec file {} \;

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSpot-DMG-Intel
          path: openspot-desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload APP artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSpot-APP-Intel
          path: openspot-desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
