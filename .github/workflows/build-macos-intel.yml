name: Build macOS DMG (Intel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel

    defaults:
      run:
        working-directory: openspot-desktop

    env:
      CI: "true"
      NODE_ENV: "production"
      APP_NAME: "OpenSpot"

      EXPO_PUBLIC_API_BASE_URL: "https://www.jiosaavn.com/api.php"
      EXPO_PUBLIC_YT_API_INSTANCES: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openspot-desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          EXPO_PUBLIC_API_BASE_URL=https://www.jiosaavn.com/api.php
          EXPO_PUBLIC_YT_API_INSTANCES=
          EOF

      - name: Create Tauri capabilities
        run: |
          mkdir -p src-tauri/capabilities

          cat > src-tauri/capabilities/default.json <<'EOF'
          {
            "$schema": "../gen/schemas/desktop-schema.json",
            "identifier": "default",
            "description": "Default capability for OpenSpot",
            "windows": [
              "main"
            ],
            "permissions": [
              "core:default",
              "http:default",
              "shell:allow-open"
            ]
          }
          EOF

      - name: Verify Expo environment
        run: |
          echo "========================================"
          echo "EXPO ENVIRONMENT"
          echo "========================================"
          echo "EXPO_PUBLIC_API_BASE_URL=$EXPO_PUBLIC_API_BASE_URL"
          echo "EXPO_PUBLIC_YT_API_INSTANCES=$EXPO_PUBLIC_YT_API_INSTANCES"

          echo ""
          echo "========================================"
          echo ".env"
          echo "========================================"
          cat .env

          echo ""
          echo "========================================"
          echo "Tauri capability"
          echo "========================================"
          cat src-tauri/capabilities/default.json

      - name: Export Expo web app
        run: |
          rm -rf dist

          echo "========================================"
          echo "EXPO EXPORT"
          echo "========================================"

          npx expo export --platform web

      - name: Verify exported bundle
        run: |
          echo "========================================"
          echo "DIST FILES"
          echo "========================================"

          find dist -type f | head -100

          echo ""
          echo "========================================"
          echo "SEARCH: jiosaavn.com"
          echo "========================================"

          grep -R -n -F "jiosaavn.com" dist | head -30 || true

          echo ""
          echo "========================================"
          echo "SEARCH: https://www.jiosaavn.com"
          echo "========================================"

          grep -R -o 'https://www\.jiosaavn\.com[^"'\'' ]*' dist | head -30 || true

          echo ""
          echo "========================================"
          echo "SEARCH: EXPO_PUBLIC_API_BASE_URL"
          echo "========================================"

          grep -R -n -F "EXPO_PUBLIC_API_BASE_URL" dist | head -30 || true

          echo ""
          echo "========================================"
          echo "SEARCH SOURCE: jiosaavn.com"
          echo "========================================"

          grep -R -n -F "jiosaavn.com" . \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.git \
            | head -30 || true

      - name: Check generated web files
        run: |
          echo "========================================"
          echo "DIST SIZE"
          echo "========================================"

          du -sh dist

          echo ""
          echo "========================================"
          echo "JS FILE COUNT"
          echo "========================================"

          find dist -type f \
            \( -name "*.js" -o -name "*.html" -o -name "*.json" \) \
            | wc -l

      - name: Build Tauri app (Intel)
        run: |
          echo "========================================"
          echo "TAURI INTEL BUILD"
          echo "========================================"

          npm run tauri:build -- --target x86_64-apple-darwin

      - name: Verify Intel binary
        run: |
          echo "========================================"
          echo "BINARY ARCHITECTURE"
          echo "========================================"

          file src-tauri/target/x86_64-apple-darwin/release/openspot 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "APP BINARY ARCHITECTURE"
          echo "========================================"

          find src-tauri/target/x86_64-apple-darwin/release/bundle/macos \
            -type f \
            -path "*/Contents/MacOS/*" \
            -exec file {} \;

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSpot-DMG-Intel
          path: openspot-desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload APP artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSpot-APP-Intel
          path: openspot-desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
