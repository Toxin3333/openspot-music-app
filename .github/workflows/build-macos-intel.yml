name: Build macOS DMG (Intel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel

    defaults:
      run:
        working-directory: openspot-desktop

    env:
      CI: "true"
      NODE_ENV: "production"
      APP_NAME: "OpenSpot"

      # OpenSpot uses JioSaavn as its music API.
      EXPO_PUBLIC_API_BASE_URL: "https://www.jiosaavn.com/api.php"

      # The app can obtain YouTube Music API instances from
      # the public openspot-config repository at runtime.
      EXPO_PUBLIC_YT_API_INSTANCES: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openspot-desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          EXPO_PUBLIC_API_BASE_URL=https://www.jiosaavn.com/api.php
          EXPO_PUBLIC_YT_API_INSTANCES=
          EOF

      - name: Create Tauri capabilities
        run: |
          mkdir -p src-tauri/capabilities

          cat > src-tauri/capabilities/default.json <<'EOF'
          {
            "$schema": "../gen/schemas/desktop-schema.json",
            "identifier": "default",
            "description": "Default capability for OpenSpot",
            "windows": [
              "main"
            ],
            "permissions": [
              "core:default",
              "http:default",
              "shell:allow-open"
            ]
          }
          EOF

            - name: Verify Expo environment
        run: |
          echo "EXPO_PUBLIC_API_BASE_URL=$EXPO_PUBLIC_API_BASE_URL"
          echo "EXPO_PUBLIC_YT_API_INSTANCES=$EXPO_PUBLIC_YT_API_INSTANCES"

          echo "===== .env ====="
          cat .env

      - name: Export Expo web app
        run: npx expo export --platform web

      - name: Verify exported bundle
        run: |
          echo "===== dist files ====="
          find dist -type f | head -50

          echo "===== Search JioSaavn URL in bundle ====="
          grep -R -l "jiosaavn.com" dist | head -20 || true

          echo "===== Search API URL ====="
          grep -R -o "https://www.jiosaavn.com[^\"']*" dist | head -20 || true

          echo "===== Search EXPO_PUBLIC_API_BASE_URL ====="
          grep -R -n "EXPO_PUBLIC_API_BASE_URL" dist | head -20 || true

      - name: Build Tauri app (Intel)
        run: npm run tauri:build -- --target x86_64-apple-darwin

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSpot-DMG-Intel
          path: openspot-desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload APP artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSpot-APP-Intel
          path: openspot-desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
